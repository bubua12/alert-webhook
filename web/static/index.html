<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert Webhook 运维控制台</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Cpath d='M7 17h4.5l2.5-6.5 4 11 2.5-4.5H25' fill='none' stroke='%23ffffff' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='17' r='2.2' fill='%23d4491f'/%3E%3C/svg%3E">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aw_theme');
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <div id="mobile-backdrop" class="mobile-backdrop" aria-hidden="true"></div>

    <aside id="sidebar" class="sidebar" aria-label="主导航">
      <div class="sidebar-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M3 13h4.2l2.5-6.8 4.4 11.6 2.5-4.8H21" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20.5" cy="13" r="1.8" fill="#d4491f"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">Alert Webhook</div>
          <div class="brand-sub">
            <span>告警路由器</span>
            <span id="nav-version" class="version-badge">v1.2.0</span>
          </div>
        </div>
        <button id="sidebar-close" class="icon-btn mobile-only" type="button" aria-label="关闭菜单">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group-label">监控</div>

        <button class="nav-item active" type="button" data-route="dashboard">
          <span class="nav-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          </span>
          <span class="nav-label">监控总览</span>
        </button>

        <button class="nav-item" type="button" data-route="alerts">
          <span class="nav-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </span>
          <span class="nav-label">告警记录</span>
          <span id="nav-firing-badge" class="nav-badge hidden">0</span>
        </button>

        <div class="nav-group-label">配置与调试</div>

        <button class="nav-item" type="button" data-route="config">
          <span class="nav-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
          </span>
          <span class="nav-label">配置中心</span>
          <span id="nav-setup-dot" class="nav-dot hidden" title="尚未完成通知渠道配置"></span>
        </button>

        <button class="nav-item" type="button" data-route="simulator">
          <span class="nav-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>
          </span>
          <span class="nav-label">调试沙箱</span>
        </button>

        <button class="nav-item" type="button" data-route="logs">
          <span class="nav-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          </span>
          <span class="nav-label">运行日志</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-meta-label">Webhook 接收端</div>
        <div class="sidebar-meta-row">
          <code id="sidebar-webhook-url" class="mono-truncate">/webhook-alert</code>
          <button id="sidebar-copy-webhook" class="icon-btn sm" type="button" title="复制接收地址" aria-label="复制 Webhook 地址">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="sidebar-health-links">
          <a href="/healthz" target="_blank" rel="noopener">/healthz</a>
          <span>·</span>
          <a href="/readyz" target="_blank" rel="noopener">/readyz</a>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menu-toggle" class="icon-btn mobile-only" type="button" aria-label="打开菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topbar-titles">
            <h1 id="page-title" class="page-title">监控总览</h1>
            <p id="page-subtitle" class="page-subtitle"></p>
          </div>
        </div>

        <div class="topbar-right">
          <div id="topbar-status-pill" class="status-pill is-loading" title="服务运行状态">
            <span class="status-dot"></span>
            <span id="topbar-status-text">连接中</span>
            <span id="topbar-uptime" class="status-uptime">--</span>
          </div>

          <label class="refresh-switch" title="每 10 秒自动刷新当前页面">
            <input id="auto-refresh-toggle" type="checkbox" checked>
            <span class="switch-track"></span>
            <span class="switch-label">自动刷新</span>
          </label>

          <button id="btn-quick-test" class="btn btn-secondary btn-sm" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span>测试推送</span>
          </button>

          <button id="btn-theme-toggle" class="icon-btn" type="button" title="切换浅色/深色主题" aria-label="切换主题">
            <svg id="theme-icon-sun" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <button id="btn-token-lock" class="btn btn-secondary btn-sm token-btn" type="button" title="配置 API Token">
            <svg id="token-icon-locked" class="hidden" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <svg id="token-icon-unlocked" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
            <span id="token-status-label">未设令牌</span>
          </button>
        </div>
      </header>

      <main id="view-root" class="view-root" aria-live="polite"></main>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container" class="toast-container" aria-live="assertive"></div>

  <!-- 滑出式详情抽屉 -->
  <div id="detail-drawer" class="drawer hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-header">
        <div>
          <h2 id="drawer-title" class="drawer-title">详情</h2>
          <p id="drawer-subtitle" class="drawer-subtitle"></p>
        </div>
        <button id="drawer-close" class="icon-btn" type="button" aria-label="关闭抽屉">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
      <div id="drawer-footer" class="drawer-footer hidden"></div>
    </div>
  </div>

  <!-- 确认弹窗 -->
  <div id="confirm-modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div id="confirm-backdrop" class="modal-backdrop"></div>
    <div class="modal-card modal-sm">
      <div class="modal-header">
        <h3 id="confirm-title" class="modal-title">确认操作</h3>
        <button id="confirm-close" class="icon-btn" type="button" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="confirm-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="confirm-cancel" class="btn btn-secondary" type="button">取消</button>
        <button id="confirm-ok" class="btn btn-primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <!-- API Token 解锁弹窗 -->
  <div id="token-modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="token-modal-title">
    <div id="token-backdrop" class="modal-backdrop"></div>
    <div class="modal-card modal-sm">
      <div class="modal-header">
        <h3 id="token-modal-title" class="modal-title">API 访问令牌验证</h3>
        <button id="token-modal-close" class="icon-btn" type="button" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="token-form">
        <div class="modal-body">
          <p id="token-modal-desc" class="text-muted">服务端已启用访问令牌保护，请输入 server.auth_token 或 ALERT_WEBHOOK_AUTH_TOKEN 进行解锁。</p>
          <div class="form-group mt-3">
            <label class="form-label" for="token-input">API Token</label>
            <div class="input-with-action">
              <input id="token-input" class="form-control mono" type="password" autocomplete="off" placeholder="输入访问令牌...">
              <button id="token-toggle-vis" class="input-action-btn" type="button" aria-label="显示或隐藏令牌">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p id="token-error" class="form-error hidden"></p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="token-clear-btn" class="btn btn-ghost text-danger" type="button">清除本地令牌</button>
          <div class="spacer"></div>
          <button id="token-cancel-btn" class="btn btn-secondary" type="button">取消</button>
          <button id="token-submit-btn" class="btn btn-primary" type="submit">保存并继续</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 快捷测试推送弹窗 -->
  <div id="quick-test-modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="quick-test-title">
    <div id="quick-test-backdrop" class="modal-backdrop"></div>
    <div class="modal-card modal-md">
      <div class="modal-header">
        <h3 id="quick-test-title" class="modal-title">快速连通性测试推送</h3>
        <button id="quick-test-close" class="icon-btn" type="button" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <p class="text-muted">向已配置的通知渠道发送一条连通性测试消息，用于验证网络及 Webhook 签名/密钥是否有效。</p>
        <div class="form-group mt-3">
          <label class="form-label" for="quick-test-client">目标渠道</label>
          <select id="quick-test-client" class="form-control">
            <option value="all">全部已启用渠道 (all)</option>
            <option value="wechat">企业微信 (wechat)</option>
            <option value="dingtalk">钉钉 (dingtalk)</option>
            <option value="feishu">飞书 (feishu)</option>
          </select>
        </div>
        <div id="quick-test-results" class="mt-3"></div>
      </div>
      <div class="modal-footer">
        <button id="quick-test-cancel" class="btn btn-secondary" type="button">关闭</button>
        <button id="quick-test-send" class="btn btn-primary" type="button">发送测试</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
