services:
  alert-webhook:
    build: .
    image: alert-webhook:latest
    container_name: alert-webhook
    restart: unless-stopped
    ports:
      - "${ALERT_WEBHOOK_HOST_PORT:-18082}:18082"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ALERT_WEBHOOK_CONFIG: /app/config/config.yaml
      ALERT_WEBHOOK_DATA_DIR: /app/data
      ALERT_WEBHOOK_LOG_DIR: /app/logs
      # 以下可选环境变量支持通过 .env 覆盖配置文件；未设置时默认为空，不会覆盖 config.yaml
      ALERT_WEBHOOK_AUTH_TOKEN: ${ALERT_WEBHOOK_AUTH_TOKEN:-}
      ALERT_WEBHOOK_WECHAT_URL: ${ALERT_WEBHOOK_WECHAT_URL:-}
      ALERT_WEBHOOK_DINGTALK_URL: ${ALERT_WEBHOOK_DINGTALK_URL:-}
      ALERT_WEBHOOK_FEISHU_URL: ${ALERT_WEBHOOK_FEISHU_URL:-}
      ALERT_WEBHOOK_CLICKHOUSE_HOST: ${ALERT_WEBHOOK_CLICKHOUSE_HOST:-}
      ALERT_WEBHOOK_CLICKHOUSE_PORT: ${ALERT_WEBHOOK_CLICKHOUSE_PORT:-}
      ALERT_WEBHOOK_CLICKHOUSE_DB: ${ALERT_WEBHOOK_CLICKHOUSE_DB:-}
      ALERT_WEBHOOK_CLICKHOUSE_USER: ${ALERT_WEBHOOK_CLICKHOUSE_USER:-}
      ALERT_WEBHOOK_CLICKHOUSE_PASSWORD: ${ALERT_WEBHOOK_CLICKHOUSE_PASSWORD:-}
      ALERT_WEBHOOK_TRAFFIC_ENABLED: ${ALERT_WEBHOOK_TRAFFIC_ENABLED:-}
      ALERT_WEBHOOK_KAFKA_ENABLED: ${ALERT_WEBHOOK_KAFKA_ENABLED:-}
      ALERT_WEBHOOK_KAFKA_UI_URL: ${ALERT_WEBHOOK_KAFKA_UI_URL:-}
      ALERT_WEBHOOK_KAFKA_CLUSTER: ${ALERT_WEBHOOK_KAFKA_CLUSTER:-}
    volumes:
      # 必须挂载宿主机目录 ./conf 到容器内 /app/config（而不是挂载单个 config.yaml 文件或 ./config Go 源码目录）：
      # 1. 避免与仓库中的 Go 源码包目录 ./config/ 发生命名冲突；
      # 2. 若宿主机尚不存在 config.yaml 时直接挂载单文件，Docker 会自动创建同名空目录导致启动失败；
      # 3. 挂载目录允许容器内 Web 控制台热更新配置时通过「临时文件 + 原子重命名 (rename)」安全落盘而不触发 EBUSY 错误。
      - ./conf:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
