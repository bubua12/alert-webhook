# Alert Webhook Notifier v1.2.0 示例配置文件
# 说明：
# 1. 支持零配置启动：即使缺少或留空部分配置，服务也可正常启动，随后可通过 Web 控制台 (http://localhost:18082) 在线配置并热生效。
# 2. 完全向后兼容 v1.0/v1.1 配置文件结构；所有选项也可通过 ALERT_WEBHOOK_* 环境变量覆盖。

server:
  # HTTP 服务监听地址（Webhook 接收端口与 Web 控制台共用）
  port: "0.0.0.0:18082"
  # 是否启用内置 Web 控制台（默认 true；关闭后仅保留 /webhook-alert、/healthz、/readyz 与 /api/*）
  ui_enabled: true
  # 可选：Web 控制台与 /api/* 接口访问令牌（留空表示不启用鉴权）
  auth_token: ""
  # 告警审计历史 (alerts.jsonl) 存储目录
  data_dir: "./data"
  # 日志文件目录（日志同时输出至标准输出 stdout，便于 docker logs 查看）
  log_dir: "./logs"

# 启用的通知客户端列表，支持同时配置多个平台: wechat / dingtalk / feishu
# 初次启动可留空 []，稍后在 Web 控制台「配置中心」中启用并测试连通性
client: []
  # - wechat
  # - dingtalk
  # - feishu

# 各通知渠道 Webhook 配置
notifiers:
  wechat:
    # 示例: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxxxxxxxxxxxxxxxx
    webhook_url: ""
  dingtalk:
    # 示例: https://oapi.dingtalk.com/robot/send?access_token=xxxxxxxxxxxxxxxxxxxxxxxxx
    webhook_url: ""
  feishu:
    # 示例: https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    webhook_url: ""

# ClickHouse 数据库配置（启用大流量告警功能时需要）
clickhouse:
  host: "localhost"
  port: 9000
  database: "nginxlogs"
  username: "default"
  password: ""

# 大流量告警配置（基于 ClickHouse 中的 Nginx 访问日志）
traffic_alert:
  # 是否启用大流量告警
  enabled: false
  # 检查间隔（秒，最小 5 秒）
  check_interval: 300
  # 请求大小阈值（字节），超过此值视为大请求
  request_size_threshold: 1048576    # 1MB
  # 响应大小阈值（字节），超过此值视为大响应
  response_size_threshold: 5242880   # 5MB
  # 统计时间窗口（分钟）
  time_window: 10
  # 触发告警的大请求/响应数量阈值
  count_threshold: 5

# Kafka 消费者组积压监控配置（基于 Kafka UI API）
kafka_monitor:
  # 是否启用 Kafka 监控
  enabled: false
  # Kafka UI 服务地址（不包含路径）
  kafka_ui_url: "http://localhost:8090"
  # Kafka 集群名称（需与 Kafka UI 中配置的集群名称一致）
  cluster_name: "local-kafka"
  # 检查间隔（秒，最小 5 秒）
  check_interval: 60
  # 消费者组积压阈值（消息数量）
  consumer_lag_threshold: 100000
  # 指定监控的消费者组列表（留空 [] 表示监控全部消费者组）
  monitored_groups: []
    # - "order-group-01"
    # - "order-group-02"
  # 忽略的消费者组列表（优先级高于 monitored_groups）
  ignored_groups: []
    # - "consumer-group-01"

# 告警过滤规则配置（可选）
# 说明：
# 1. 支持 * 通配符，如 "High*" 匹配前缀、"*Test*" 匹配包含
# 2. exclude 规则优先级高于 include 规则
# 3. alert_name 与 severity 两个维度需同时通过才会推送
filter:
  alert_name:
    include: []
      # - "HighCPU*"
      # - "*Memory*"
      # - "DiskSpaceLow"
    exclude: []
      # - "*Test*"
      # - "DebugAlert"
      # - "InfoInhibitor"
  severity:
    include: []
      # - "emergency"
      # - "critical"
      # - "warning"
    exclude:
      - "info"
      - "none"
